name: pages
# Build the PWA and publish it to GitHub Pages (docs/PWA-SPEC.md §7).
# Nothing deploys unless the private-data check, the tests and the build
# (with its bundle and style checks) all pass.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Private-data check (all tracked files)
        run: node tools/check-private.mjs --all
      - run: npm ci
      - run: npm test
      - name: Build (typecheck, bundle check, style check)
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

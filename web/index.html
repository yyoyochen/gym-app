<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1c1724" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="A workout log that promises, grades and coaches. Offline; your data stays on your phone." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>gym-app</title>
    <script>
      // Apply the cached theme before first paint (IndexedDB is the source of truth; ui/kit/useTheme.ts).
      try { var t = localStorage.getItem('gymbro.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
      // Same for the language (i18n/lang.ts): cached choice, else the phone's language.
      try { var l = localStorage.getItem('gymbro.lang'); if (l !== 'en' && l !== 'zh') l = /^zh\b/i.test(navigator.language || '') ? 'zh' : 'en'; document.documentElement.lang = l === 'zh' ? 'zh-Hant-TW' : 'en'; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
